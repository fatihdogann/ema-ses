name: EMA Ses paketleri

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paket:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-arm64
          - os: windows-2025
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_VERSION: "0.13.0"
      EMA_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Paketi oluştur
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, sys, urllib.request

          root = pathlib.Path('dist', 'EMA Ses')
          root.mkdir(parents=True)
          for name in ('app.py', 'index.html', 'launch.py', 'pyproject.toml', 'uv.lock', 'LICENSE'):
              shutil.copy2(name, root / name)
          if sys.platform == 'darwin':
              for name in ('Baslat.command', 'uygulama_olustur.py'):
                  shutil.copy2(name, root / name)
              subprocess.run([sys.executable, 'uygulama_olustur.py'], cwd=root, check=True)
              (root / 'uygulama_olustur.py').unlink()
              uv_name = 'uv'
          else:
              shutil.copy2('Baslat.bat', root / 'Baslat.bat')
              uv_name = 'uv.exe'
          shutil.copy2(shutil.which(uv_name), root / uv_name)
          version = os.environ['UV_VERSION']
          urllib.request.urlretrieve(
              f'https://raw.githubusercontent.com/astral-sh/uv/{version}/LICENSE-MIT',
              root / 'LICENSE-uv',
          )
          shutil.make_archive(f"dist/EMA-Ses-{os.environ['EMA_PLATFORM']}", 'zip', 'dist', 'EMA Ses')
          PY
      - name: Paketten açılışı, WAV ve çevrimdışı yeniden açılışı doğrula
        shell: bash
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/ema-uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/ema-python
          UV_MANAGED_PYTHON: "1"
          HF_HOME: ${{ runner.temp }}/ema-hf
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, subprocess, sys, time, urllib.request

          package = pathlib.Path('dist', f"EMA-Ses-{os.environ['EMA_PLATFORM']}.zip")
          if sys.platform == 'darwin':
              subprocess.run(['ditto', '-x', '-k', str(package), 'deneme'], check=True)
              launcher = [str(pathlib.Path('deneme/EMA Ses/EMA Ses.app/Contents/MacOS/EMA-Ses').resolve())]
              uv = 'uv'
          else:
              shutil.unpack_archive(package, 'deneme')
              launcher = ['cmd.exe', '/d', '/c', 'Baslat.bat']
              uv = 'uv.exe'
          root = pathlib.Path('deneme', 'EMA Ses').resolve()
          shutil.copy2('kontrol.py', root / 'kontrol.py')
          url = 'http://127.0.0.1:7868'
          for offline in (False, True):
              env = dict(os.environ, UV_OFFLINE='1', HF_HUB_OFFLINE='1') if offline else os.environ
              try:
                  subprocess.run([*launcher, '--no-browser'], cwd=root, env=env, check=True, timeout=360)
                  subprocess.run([str(root / uv), 'run', '--locked', 'python', 'kontrol.py'], cwd=root, env=env, check=True)
              except subprocess.SubprocessError:
                  if (root / 'uygulama.log').exists():
                      print((root / 'uygulama.log').read_text(encoding='utf-8', errors='replace')[-4000:])
                  raise
              finally:
                  try:
                      with urllib.request.urlopen(url + '/session', timeout=2) as response:
                          token = json.load(response)['token']
                      stop = urllib.request.Request(url + '/stop', data=b'', headers={'X-EMA-Token': token})
                      urllib.request.urlopen(stop, timeout=2).close()
                  except OSError:
                      pass
                  for _ in range(20):
                      try:
                          urllib.request.urlopen(url + '/health', timeout=1).close()
                      except OSError:
                          break
                      time.sleep(0.25)
                  else:
                      raise RuntimeError('Yerel sunucu kapanmadı.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EMA-Ses-${{ matrix.platform }}
          path: dist/EMA-Ses-${{ matrix.platform }}.zip
          if-no-files-found: error
