[project]
name = "ema-ses"
version = "0.1.1"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ema-lightning==1.0.1",
    "filelock",
    "imageio-ffmpeg",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
